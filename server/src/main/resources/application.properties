micronaut.application.name=password-server
# The database is a single encrypted blob of the password entries, typically a few KB. Larger requests get a 413.
micronaut.server.max-request-size=4MB
# The emergency web client, see WebHeadersFilter. Routes of the controllers take precedence.
micronaut.router.static-resources.web.paths=classpath:web
micronaut.router.static-resources.web.mapping=/**
