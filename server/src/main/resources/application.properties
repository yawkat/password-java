micronaut.application.name=password-server
# The database is a single encrypted blob of the password entries, typically a few KB. Bodies are buffered in memory
# before the controller (and thus the token check) runs, so this bounds the memory a single request can occupy while
# leaving several orders of magnitude of headroom for large databases. Both limits default to 10MB: max-request-size
# caps the body, max-request-buffer-size caps how much of it is buffered for binding to byte[].
micronaut.server.max-request-size=64MB
micronaut.server.max-request-buffer-size=64MB
