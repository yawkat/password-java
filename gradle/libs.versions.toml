[versions]
jackson = "2.22.3"
# Micronaut platform BOM, applied to :server by the Micronaut Gradle plugin
micronaut-platform = "5.1.5"
lombok = "1.18.48"
slf4j = "2.0.20"
kotlin = "2.4.20"
compose = "1.12.1"
# the version the compose gradle plugin 1.12.1 pairs with (ComposeBuildConfig.composeMaterial3Version)
compose-material3 = "1.9.0"
androidx-lifecycle = "2.11.0"
kotlinx-coroutines = "1.11.0"
# Android Gradle Plugin. It is only put on the build classpath when the Android build is enabled, see build.gradle.kts.
agp = "9.4.1"
androidx-activity = "1.13.0"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
android-compileSdk = "37"
# newer than AGP's default (36.0.0)
android-buildTools = "37.0.0"
# Android 10
android-minSdk = "29"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
testng = { module = "org.testng:testng", version = "7.12.0" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.86" }
jopt-simple = { module = "net.sf.jopt-simple:jopt-simple", version = "5.0.4" }
expiringmap = { module = "net.jodah:expiringmap", version = "0.5.11" }
# versions managed by the Micronaut platform BOM
logback-classic = { module = "ch.qos.logback:logback-classic" }
micronaut-http-server = { module = "io.micronaut:micronaut-http-server" }
micronaut-http-client = { module = "io.micronaut:micronaut-http-client" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
lombok = { id = "io.freefair.lombok", version = "9.7.0" }
# the minimal variant of io.micronaut.application: same DSL, without the docker/graalvm/aot/test-resources/openrewrite plugins
micronaut-application = { id = "io.micronaut.minimal.application", version = "5.0.2" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
