name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # for the Android app; AGP installs the platform and build tools it needs
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # builds (but does not upload) the debug and the unsigned release APK
      - name: Build with Gradle
        run: ./gradlew build

  # Instrumented tests of the Android app on the oldest supported Android version (API 29): libraries may call JDK
  # methods that only newer Android versions have, which only fails at runtime.
  api29:
    runs-on: ubuntu-latest
    # A run takes about 6 minutes; don't let an emulator that doesn't shut down hold the runner for 6 hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A fresh, cold-booted AVD every time: with the AVD and its boot snapshot restored from actions/cache, the
      # emulator never exits after the tests (in android-emulator-runner's "Terminate Emulator"), so every run
      # with a cache hit hung until the job was cancelled after 6 hours.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :android:connectedDebugAndroidTest

  nix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check flake
        run: nix flake check -L
