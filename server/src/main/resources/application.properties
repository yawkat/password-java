micronaut.application.name=password-server
# Upper limit for request bodies, i.e. the database blob. The database is a single encrypted blob of the password
# entries, typically a few KB, so 64MB leaves several orders of magnitude of headroom. Larger requests get a 413.
# Both limits default to 10MB: max-request-size caps the body, max-request-buffer-size caps how much of it is buffered
# in memory for binding to byte[]. Keep them equal. Only requests that pass AuthFilter are buffered at all.
# Override both at runtime with the environment variables
#   MICRONAUT_SERVER_MAX_REQUEST_SIZE=128MB MICRONAUT_SERVER_MAX_REQUEST_BUFFER_SIZE=128MB
# or the system properties
#   java -Dmicronaut.server.max-request-size=128MB -Dmicronaut.server.max-request-buffer-size=128MB -jar ...
micronaut.server.max-request-size=64MB
micronaut.server.max-request-buffer-size=64MB
